<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline, Internal and External CSS</title>
    <style>
        p{
            color: red;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>3 ways to add CSS to HTML</h1>
    <ol>
        <li style="color: blue;">Inline CSS - we use style attribute</li>
        <li><p>Internal CSS - we use style tag</p></li>
        <li><h5>External CSS - we use .css file using link css </h5></li>
    </ol>
</body>
</html>
