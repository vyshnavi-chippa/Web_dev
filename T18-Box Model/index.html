<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        .box1{
            margin: 10px;
            padding: 10px;
            border: 5px solid black;
            height: 40px;
            box-sizing: border-box;
            background-color: rgb(143, 183, 213);
        }
        .box2{
            margin: 20px;
            padding: 10px;
            border: 5px solid black;
            height: 40px;
            box-sizing: border-box;
            background-color: rgb(237, 174, 237);
        }
    </style>
</head>
<body>
    <div class="box1">This is box1.</div>
    <div class="box2">This is box2.</div>
    <p>Box-sizing: border box is for width or height is considered for border,padding and content </p>
    <p>margin collapse is used as default like if there are elements with overlapping margin then the max margin considered default</p>
</body>
</html>
