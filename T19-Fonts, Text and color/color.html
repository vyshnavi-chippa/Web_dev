<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <style>
        li,p{
            font-size: large;
        }
        #c2{
            color: blueviolet;
        }
        #h{
            color: #a70e0e;
        }
        #r1{
            color: rgb(219, 219, 73);
        }
        #r2{
            color: rgba(100, 75, 215, 0.5);
        }
        #h1{
            color: hsl(21, 86%, 48%);
        }
        #h2{
            color: hsla(177, 86%, 48%, 0.903);
        }
    </style>
</head>
<body>
    <h1>Color</h1>
    <p class="c1">Types
        <ol>
            <li id="c2">color keyword</li>
            <li id="h">hex code</li>
            <li id="r1">rgb</li>
            <li id="r2">rgba</li>
            <li id="h1">hsl</li>
            <li id="h2">hsla</li>
        </ol>
    </p>
</body>
</html>
