<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <style>
        h1{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .fonts{
            font-size: large;
            font-weight: 570;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Fonts</h1>
    <p class="fonts">There are so many properties for fonts
        <ol>
            <li>font family</li>
            <li>font style</li>
            <li>font size</li>
            <li>font weight</li>
        </ol>
    </p>
    <p>Fallback fonts are very imp</p>
    <p>we can add fonts via google fonts in 2 ways
        <ol>
            <li>using import in style tag and css</li>
            <li>link in head tag and css</li>
        </ol>
    </p>
</body>
</html>
