<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <style>
        h1{
            text-align: center;
            text-decoration: underline;
            text-decoration-color: blueviolet;
            text-decoration-style: wavy;
            text-decoration-thickness: 5px;
        }
        .texts{
            text-transform: capitalize;
            text-indent: 10px;
        }
        .c1{
            text-overflow:ellipsis;
            width: 75px;
            overflow: scroll;
        }
    </style>
</head>
<body>
    <h1>Text</h1>
    <p class="texts">There are so many properties for texts
        <ol>
            <li>text decoration -- color,style,thickness</li>
            <li>text transform</li>
            <li>text align</li>
            <li>text indent</li>
            <li>text overflow</li>
        </ol>
    </p>
    <p class="c1">Some other imp like line height for spacing, letter spacing, word break, overflow</p>
</body>
</html>
