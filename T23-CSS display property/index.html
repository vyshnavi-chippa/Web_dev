<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display property</title>
    <style>
        .div1{
            height: 50px;
            border: 2px solid blue;
            padding: 20px;
            margin: 20px;
            display: inline-block;
        }
        .div2{
            height: 50px;
            border: 2px solid blue;
            padding: 20px;
            display: inline-block;
            visibility: hidden;
        }
        .div3{
            height: 50px;
            border: 2px solid blue;
            padding: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="div1">This is my first div</div>
    <div class="div2">This is my second div</div>
    <div class="div3">This is my third div</div>
</body>
</html>
