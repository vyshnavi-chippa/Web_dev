<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .div{
            height: 30px;
            margin: 50px;
            box-shadow: 10px 5px 5px 5px #94c1c3;
            border: 5px solid #d61f1f;
            outline: 5px solid rebeccapurple;
            outline-offset: 20px;
            background-color: pink;
        }
        .p{
            text-shadow: 1px 4px 2px #c88fc8;;
        }
    </style>
</head>
<body>
    <div class="div">This is div</div>
    <p class="p">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nam numquam molestiae assumenda illo incidunt reiciendis soluta eaque a, quam suscipit libero aspernatur dicta doloremque, nesciunt debitis quos officiis tempora, veniam cumque dolore corporis! Quae, voluptatum?</p>
</body>
</html>
