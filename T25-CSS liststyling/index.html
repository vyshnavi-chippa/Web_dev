<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS List Styling</title>
    <style>
        ul{
            display: flex;
            padding: 20px;
        }
        nav ul li{
           /* list-style-image: url("https://mooddp.com/wp-content/uploads/2025/12/cartoon-style-avatar-whatsapp.jpg");*/
            list-style-type: "😊";
           /* background-color: blueviolet;*/
            list-style-position: inside;
            padding-left:50px;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
